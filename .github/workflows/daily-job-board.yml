name: Daily job board refresh

on:
  schedule:
    # 6:00 AM MST is 13:00 UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh job board
        run: python scripts/update_job_board.py

      - name: Commit refreshed board
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh job board"
          file_pattern: "jobs.html data/jobs.json"
